# This is a Declarative Automation Bundle definition for dabtutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabtutorial
  uuid: 97525947-1d62-45f2-a852-864ee5fbb4a0

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-3a3fe619-5d0f.cloud.databricks.com/
    variables:
      catalog: assetbundles
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/smrbanerjee43@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/smrbanerjee43@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: assetbundles
      schema: prod
    permissions:
      - user_name: smrbanerjee43@gmail.com
        level: CAN_MANAGE
